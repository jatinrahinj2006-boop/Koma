<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koma — Manga & Manhwa Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <img src="../icons/icon-48.png" alt="Logo" width="28" height="28" style="border-radius: 6px;">
        </div>
        <div class="brand-text">
          <h1>Koma <span style="font-size: 10px; opacity: 0.7; font-weight: 500; background: rgba(225,29,72,0.2); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(225,29,72,0.3); color: #fda4af;">v1.3.4</span></h1>
          <span class="badge" id="detected-site-badge">No active tab</span>
        </div>
      </div>
    </header>

    <!-- Detected Page Card with Editable Title -->
    <div class="info-card">
      <div class="info-row">
        <span class="label">ZIP Name:</span>
        <input type="text" id="series-title-input" class="title-input" placeholder="Series title" value="">
      </div>
      <div class="info-row">
        <span class="label">Current Ch:</span>
        <span class="value highlight" id="current-chapter-num">-</span>
        <span class="badge history-badge hidden" id="history-badge"></span>
      </div>
    </div>

    <!-- Quick Nav: Side Panel, PDF Studio & Dup Checker -->
    <div class="quick-nav-bar">
      <button id="btn-open-sidepanel" class="quick-nav-btn" title="Open Reviewer Side Panel">
        <span>Side Panel</span>
      </button>
      <button id="btn-open-pdf-studio" class="quick-nav-btn" title="Open PDF Studio Compiler">
        <span>PDF Studio</span>
      </button>
      <button id="btn-open-pdf-dupchecker" class="quick-nav-btn" title="Open PDF Duplicate Checker">
        <span>Dup Checker</span>
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="tab-menu">
      <button class="tab-btn active" data-tab="single-tab">Current Ch</button>
      <button class="tab-btn" data-tab="batch-tab">Batch (X–Y)</button>
      <button class="tab-btn" data-tab="toc-tab" id="tab-btn-toc">Series TOC</button>
      <button class="tab-btn" data-tab="history-tab">History & Saved</button>
    </div>

    <!-- Scrollable content area -->
    <div class="main-content-scroll">
      <!-- Tab 1: Single Chapter -->
      <div class="tab-content active" id="single-tab">
        <button id="btn-download-single" class="btn primary-btn">
          <span>Download Chapter</span>
        </button>

        <!-- Thumbnail Preview Grid Toggle -->
        <div class="preview-toggle-row">
          <button id="btn-toggle-preview" class="btn secondary-btn small-btn">
            <span>Rearrange & Select (<span id="detected-count">0</span>)</span>
          </button>
          <button id="btn-pdf-preview" class="btn secondary-btn small-btn accent">
            <span>Live PDF Preview</span>
          </button>
        </div>

        <!-- Thumbnail Grid Container -->
        <div class="thumbnail-preview-container hidden" id="thumbnail-preview-container">
          <div class="preview-header">
            <span>Select Images to Include:</span>
            <div class="preview-actions">
              <button id="btn-select-all" class="text-link">All</button>
              <button id="btn-deselect-all" class="text-link">None</button>
            </div>
          </div>
          <div class="thumbnail-grid" id="thumbnail-grid">
            <!-- Dynamically populated thumbnails -->
          </div>
        </div>
      </div>

      <!-- Tab 2: Batch Range -->
      <div class="tab-content" id="batch-tab">
        <div class="range-inputs">
          <div class="input-group">
            <label for="start-chapter">From Ch:</label>
            <input type="number" id="start-chapter" min="1" value="1">
          </div>
          <span class="range-separator">to</span>
          <div class="input-group">
            <label for="end-chapter">To Ch:</label>
            <input type="number" id="end-chapter" min="1" value="10">
          </div>
        </div>
        <div class="setting-item" style="margin: 8px 0;">
          <label for="batch-bundle-select">Packaging:</label>
          <select id="batch-bundle-select" class="custom-select">
            <option value="single_archive" selected>1 Single Combined Archive (All Chapters in 1 ZIP)</option>
            <option value="volume_chunks">Volume Chunks (Every 25 Chs in 1 ZIP)</option>
            <option value="chapter_zip">Separate ZIP per Chapter</option>
          </select>
        </div>
        <div class="setting-item checkbox-item highlight-box">
          <input type="checkbox" id="batch-parallel-toggle" checked>
          <label for="batch-parallel-toggle">5x Multi-Tab Parallel Engine</label>
        </div>
        <button id="btn-download-batch" class="btn primary-btn">
          <span>Download Chapter Range</span>
        </button>
      </div>

      <!-- Tab 3: Series TOC Chapter List Scanner -->
      <div class="tab-content" id="toc-tab">
        <div class="toc-header-row">
          <span>Detected Chapters (<span id="toc-count">0</span>):</span>
          <button id="btn-scan-toc" class="text-link">Scan Page</button>
        </div>
        <div class="toc-list" id="toc-list">
          <p class="empty-hint">Open a series main page to scan chapter TOC.</p>
        </div>
        <button id="btn-download-toc-selected" class="btn primary-btn" style="margin-top:8px;">
          <span>Download Selected Chapters</span>
        </button>
      </div>

      <!-- Tab 4: History & Bookmarks -->
      <div class="tab-content" id="history-tab">
        <div class="sub-tab-menu">
          <button class="sub-tab-btn active" id="btn-sub-history">Download History</button>
          <button class="sub-tab-btn" id="btn-sub-bookmarks">Saved Bookmarks</button>
        </div>
        <button id="btn-add-bookmark" class="btn secondary-btn small-btn" style="margin-bottom:8px;">
          <span>Bookmark Current Page</span>
        </button>
        <div class="history-list" id="history-list">
          <!-- Dynamically populated history/bookmark cards -->
        </div>
      </div>

      <!-- Download Settings -->
      <div class="settings-panel">
        <div class="setting-item">
          <label for="format-select">Format:</label>
          <select id="format-select" class="custom-select">
            <option value="zip">ZIP Archive (.zip)</option>
            <option value="cbz">CBZ Comic Archive (.cbz)</option>
            <option value="pdf">PDF Document (.pdf)</option>
            <option value="folder">Subfolder per Chapter</option>
          </select>
        </div>

        <!-- Polite Request Delay Setting -->
        <div class="setting-item">
          <label for="delay-select">Request Delay:</label>
          <select id="delay-select" class="custom-select">
            <option value="0">0ms (Fastest)</option>
            <option value="150" selected>150ms (Normal)</option>
            <option value="500">500ms (Polite)</option>
            <option value="1000">1000ms (Safe Anti-Bot)</option>
            <option value="2000">2000ms (Strict Rate Limits)</option>
          </select>
        </div>

        <div class="setting-item checkbox-item">
          <input type="checkbox" id="parallel-download-toggle" checked>
          <label for="parallel-download-toggle">5x Multi-Tab Parallel Downloader</label>
        </div>

        <div class="setting-item checkbox-item">
          <input type="checkbox" id="background-mode-toggle" checked>
          <label for="background-mode-toggle">Run in Background Tab</label>
        </div>

        <div class="setting-item checkbox-item">
          <input type="checkbox" id="auto-scroll-toggle" checked>
          <label for="auto-scroll-toggle">Auto-scroll for lazy-loaded images</label>
        </div>

        <div class="setting-item checkbox-item">
          <input type="checkbox" id="high-res-toggle" checked>
          <label for="high-res-toggle">High-Res Auto-Fix (Clean Unscaled URLs)</label>
        </div>

        <div class="setting-item checkbox-item">
          <input type="checkbox" id="auto-split-toggle" checked>
          <label for="auto-split-toggle">Auto-Split Long Webtoon Strips</label>
        </div>

        <div class="setting-item checkbox-item">
          <input type="checkbox" id="filter-promos-toggle" checked>
          <label for="filter-promos-toggle">Filter Discord & Credit End-Cards</label>
        </div>

        <div class="setting-item checkbox-item">
          <input type="checkbox" id="enhance-contrast-toggle">
          <label for="enhance-contrast-toggle">Text Sharpness & Contrast Booster</label>
        </div>
      </div>
    </div>

    <!-- Progress Card (Hidden when idle) -->
    <div class="progress-card hidden" id="progress-card">
      <div class="progress-header">
        <span id="progress-status-title">Downloading...</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%"></div>
      </div>
      <p class="progress-subtext" id="progress-subtext">Preparing queue...</p>
      <button id="btn-cancel" class="btn danger-btn text-btn">Cancel Download</button>
    </div>

    <!-- Download Queue Card -->
    <div class="queue-card hidden" id="queue-card">
      <div class="queue-header">
        <span>Download Queue (<span id="queue-count">0</span>)</span>
        <button id="btn-clear-queue" class="text-link">Clear Done</button>
      </div>
      <div class="queue-list" id="queue-list">
        <!-- Dynamically populated queue items -->
      </div>
    </div>
  </div>

  <!-- Live PDF Previewer Modal -->
  <div class="lightbox-modal hidden" id="pdf-preview-modal">
    <span class="lightbox-close" id="pdf-preview-close">&times;</span>
    <div class="pdf-modal-card">
      <div class="pdf-modal-header">
        <span>PDF Page Preview (<span id="pdf-current-page-num">1</span>/<span id="pdf-total-pages-num">1</span>)</span>
      </div>
      <div class="pdf-preview-viewport">
        <img id="pdf-preview-img" src="" alt="PDF Page Preview">
      </div>
      <div class="pdf-nav-row">
        <button id="pdf-prev-btn" class="btn secondary-btn small-btn">Previous</button>
        <button id="pdf-next-btn" class="btn secondary-btn small-btn">Next</button>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal hidden" id="lightbox-modal">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Full Preview">
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
